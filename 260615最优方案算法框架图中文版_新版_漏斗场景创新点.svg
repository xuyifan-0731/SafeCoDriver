<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">

<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="55%" stop-color="#eef6ff"/>
    <stop offset="100%" stop-color="#fff7ed"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
  </filter>
  <filter id="thinShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
  </marker>
  <style>
    .small { font-family: WenQuanYi Zen Hei; font-size: 18px; fill: #475569; }
    .tiny { font-family: WenQuanYi Zen Hei; font-size: 15px; fill: #64748b; }
    .code { font-family: "JetBrains Mono", "Consolas", monospace; font-size: 17px; fill: #334155; }
    .cardTitle { font-family: WenQuanYi Zen Hei; font-size: 26px; font-weight: 800; fill: #0f172a; }
  </style>
</defs>

<rect width="1800" height="1120" fill="url(#bg)"/>
<text x="72" y="72" font-family='WenQuanYi Zen Hei' font-size="38" font-weight="800" fill="#0f172a" text-anchor="start">
<tspan x="72" dy="0">新版：漏斗收敛 + 创新点侧注</tspan>
</text>
<text x="74" y="108" font-family='WenQuanYi Zen Hei' font-size="19" font-weight="500" fill="#475569" text-anchor="start">
<tspan x="74" dy="0">四层漏斗从宽泛输入逐步收敛到精确动作；两侧方框说明对应创新点。</tspan>
</text>
<rect x="70" y="145" width="1660" height="875" rx="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#softShadow)"/>
<text x="900" y="205" font-family='WenQuanYi Zen Hei' font-size="30" font-weight="900" fill="#0f172a" text-anchor="middle">
<tspan x="900" dy="0">由宽到窄的安全约束收敛</tspan>
</text>
<text x="900" y="235" font-family='WenQuanYi Zen Hei' font-size="19" font-weight="700" fill="#475569" text-anchor="middle">
<tspan x="900" dy="0">候选输入 → 可行路点 → 可靠触发 → 方向性动作</tspan>
</text>
<path d="M330 265 H1470 L1270 800 H530 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.4"/>
<rect x="410" y="290" width="980" height="78" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2" filter="url(#thinShadow)"/>
<text x="438" y="324" font-family='WenQuanYi Zen Hei' font-size="23" font-weight="900" fill="#2563eb" text-anchor="start">
<tspan x="438" dy="0">1. 候选输入空间</tspan>
</text>
<text x="438" y="351" font-family='WenQuanYi Zen Hei' font-size="16" font-weight="700" fill="#334155" text-anchor="start">
<tspan x="438" dy="0">协同感知对象、V2X-only 目标、上游规划路点</tspan>
</text>
<rect x="470" y="405" width="860" height="78" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2" filter="url(#thinShadow)"/>
<text x="498" y="439" font-family='WenQuanYi Zen Hei' font-size="23" font-weight="900" fill="#ea580c" text-anchor="start">
<tspan x="498" dy="0">2. 几何可行路点空间</tspan>
</text>
<text x="498" y="466" font-family='WenQuanYi Zen Hei' font-size="16" font-weight="700" fill="#334155" text-anchor="start">
<tspan x="498" dy="0">可见性边界 + 接近速度放大 + 多目标排斥，先把路点推出危险区</tspan>
</text>
<rect x="540" y="520" width="720" height="78" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.2" filter="url(#thinShadow)"/>
<text x="568" y="554" font-family='WenQuanYi Zen Hei' font-size="23" font-weight="900" fill="#7c3aed" text-anchor="start">
<tspan x="568" dy="0">3. 低误报触发空间</tspan>
</text>
<text x="568" y="581" font-family='WenQuanYi Zen Hei' font-size="16" font-weight="700" fill="#334155" text-anchor="start">
<tspan x="568" dy="0">检测-修正解耦；AND 降噪；front_ttc&lt;3s 保留紧急响应</tspan>
</text>
<rect x="620" y="635" width="560" height="78" rx="22" fill="#ecfdf5" stroke="#059669" stroke-width="2.2" filter="url(#thinShadow)"/>
<text x="648" y="669" font-family='WenQuanYi Zen Hei' font-size="23" font-weight="900" fill="#059669" text-anchor="start">
<tspan x="648" dy="0">4. 方向性安全动作空间</tspan>
</text>
<text x="648" y="696" font-family='WenQuanYi Zen Hei' font-size="16" font-weight="700" fill="#334155" text-anchor="start">
<tspan x="648" dy="0">front/rear 风险分解；后车压力触发保持速度 + 横向逃逸</tspan>
</text>
<path d="M900 368 L900 405" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round"/>
<path d="M900 483 L900 520" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round"/>
<path d="M900 598 L900 635" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="690" y="745" width="420" height="64" rx="22" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2" filter="url(#thinShadow)"/>
<text x="900" y="786" font-family='WenQuanYi Zen Hei' font-size="25" font-weight="900" fill="#991b1b" text-anchor="middle">
<tspan x="900" dy="0">最终安全约束输出</tspan>
</text>
<text x="900" y="836" font-family='WenQuanYi Zen Hei' font-size="18" font-weight="800" fill="#334155" text-anchor="middle">
<tspan x="900" dy="0">修正后路点 / target_speed_factor / lane_escape / 可解释风险信号</tspan>
</text>
<rect x="105" y="270" width="235" height="118" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#thinShadow)"/>

<g transform="translate(124 309) scale(0.48)" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M8 46 Q42 12 76 46 Q42 80 8 46 Z" fill="#ffffff"/>
  <circle cx="42" cy="46" r="13" fill="#cffafe"/>
</g>
<text x="183" y="308" font-family='WenQuanYi Zen Hei' font-size="18" font-weight="900" fill="#0f172a" text-anchor="start">
<tspan x="183" dy="0">协同输入不只看自车</tspan>
</text>
<text x="183" y="337" font-family='WenQuanYi Zen Hei' font-size="14" font-weight="700" fill="#334155" text-anchor="start">
<tspan x="183" dy="0">V2X-only 与可见性标记</tspan>
<tspan x="183" dy="22">进入同一约束计算</tspan>
</text>
<path d="M340 329 L410 329" fill="none" stroke="#2563eb" stroke-width="2.7" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="105" y="440" width="235" height="132" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#thinShadow)"/>

<g transform="translate(124 485) scale(0.48)" fill="none" stroke="#ea580c" stroke-width="2.5">
  <rect x="10" y="10" width="72" height="72" rx="12" fill="#ffffff"/>
  <path d="M34 10 V82 M58 10 V82 M10 34 H82 M10 58 H82"/>
  <circle cx="58" cy="34" r="8" fill="#fed7aa"/>
</g>
<text x="183" y="478" font-family='WenQuanYi Zen Hei' font-size="18" font-weight="900" fill="#0f172a" text-anchor="start">
<tspan x="183" dy="0">创新点一：动态安全区间</tspan>
</text>
<text x="183" y="507" font-family='WenQuanYi Zen Hei' font-size="14" font-weight="700" fill="#334155" text-anchor="start">
<tspan x="183" dy="0">2.5m / 4.0m 自适应边界</tspan>
<tspan x="183" dy="22">接近越快，约束越强</tspan>
</text>
<path d="M340 506 L470 444" fill="none" stroke="#ea580c" stroke-width="2.7" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="1460" y="385" width="250" height="132" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#thinShadow)"/>

<g transform="translate(1478 430) scale(0.48)" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round">
  <circle cx="42" cy="42" r="34" fill="#ffffff"/>
  <path d="M42 22 V43 L58 53"/>
</g>
<text x="1538" y="423" font-family='WenQuanYi Zen Hei' font-size="18" font-weight="900" fill="#0f172a" text-anchor="start">
<tspan x="1538" dy="0">创新点二：低误报触发</tspan>
</text>
<text x="1538" y="452" font-family='WenQuanYi Zen Hei' font-size="14" font-weight="700" fill="#334155" text-anchor="start">
<tspan x="1538" dy="0">几何修正与检测解耦</tspan>
<tspan x="1538" dy="22">AND + front_ttc 覆盖</tspan>
</text>
<path d="M1460 452 L1330 444" fill="none" stroke="#7c3aed" stroke-width="2.7" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="1460" y="560" width="250" height="145" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#thinShadow)"/>

<g transform="translate(1478 606) scale(0.48)" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M18 84 C24 58 28 36 30 10"/>
  <path d="M70 84 C64 58 60 36 58 10"/>
  <path d="M44 80 V54"/>
  <path d="M44 44 V24"/>
  <path d="M32 37 L44 24 L56 37"/>
</g>
<text x="1538" y="598" font-family='WenQuanYi Zen Hei' font-size="18" font-weight="900" fill="#0f172a" text-anchor="start">
<tspan x="1538" dy="0">创新点三：RearEscape</tspan>
</text>
<text x="1538" y="627" font-family='WenQuanYi Zen Hei' font-size="14" font-weight="700" fill="#334155" text-anchor="start">
<tspan x="1538" dy="0">后方压力不等于急刹</tspan>
<tspan x="1538" dy="22">前方非立即碰撞时横向逃逸</tspan>
</text>
<path d="M1460 632 L1180 674" fill="none" stroke="#059669" stroke-width="2.7" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="620" y="890" width="560" height="58" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8" />
<text x="900" y="927" font-family='WenQuanYi Zen Hei' font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle">
<tspan x="900" dy="0">核心主张：把协同感知收敛为可执行安全约束，而不是只给风险分数</tspan>
</text>
<text x="74" y="1072" font-family='WenQuanYi Zen Hei' font-size="15" font-weight="500" fill="#64748b" text-anchor="start">
<tspan x="74" dy="0">当前综合最优主线：Hybrid+AND+TTC+RearEscape-thr0.30；图中完整三层风险接口只作为扩展能力提示，不作为最优主路径。</tspan>
</text>
</svg>
