    .tiny { font-family: WenQuanYi Zen Hei; font-size: 15px; fill: #64748b; }
    .code { font-family: "JetBrains Mono", "Consolas", monospace; font-size: 17px; fill: #334155; }
    .cardTitle { font-family: WenQuanYi Zen Hei; font-size: 26px; font-weight: 800; fill: #0f172a; }
  </style>
</defs>

