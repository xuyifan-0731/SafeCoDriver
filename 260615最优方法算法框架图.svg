<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .title { font-family: "Arial", "Noto Sans CJK SC", sans-serif; font-size: 34px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: "Arial", "Noto Sans CJK SC", sans-serif; font-size: 16px; fill: #4b5563; }
      .stage { font-family: "Arial", "Noto Sans CJK SC", sans-serif; font-size: 16px; font-weight: 700; fill: #374151; letter-spacing: .3px; }
      .label { font-family: "Arial", "Noto Sans CJK SC", sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .body { font-family: "Arial", "Noto Sans CJK SC", sans-serif; font-size: 14px; fill: #374151; }
      .small { font-family: "Arial", "Noto Sans CJK SC", sans-serif; font-size: 12.5px; fill: #4b5563; }
      .tiny { font-family: "Arial", "Noto Sans CJK SC", sans-serif; font-size: 11.5px; fill: #6b7280; }
      .mono { font-family: "Consolas", "Menlo", monospace; font-size: 12px; fill: #1f2937; }
      .badge { font-family: "Arial", "Noto Sans CJK SC", sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
      .box { stroke-width: 1.45; rx: 18; ry: 18; }
      .subbox { stroke-width: 1.1; rx: 12; ry: 12; }
      .arrow { fill: none; stroke-width: 2.2; marker-end: url(#arrowGray); }
      .arrowInput { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrowBlue); }
      .arrowGeo { fill: none; stroke: #ea580c; stroke-width: 2.2; marker-end: url(#arrowOrange); }
      .arrowTrigger { fill: none; stroke: #7c3aed; stroke-width: 2.2; marker-end: url(#arrowPurple); }
      .arrowDir { fill: none; stroke: #059669; stroke-width: 2.2; marker-end: url(#arrowGreen); }
      .arrowDecision { fill: none; stroke: #b45309; stroke-width: 2.2; marker-end: url(#arrowAmber); }
    </style>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#111827" flood-opacity="0.10"/>
    </filter>

    <marker id="arrowGray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>

    <linearGradient id="pageBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="inputFill" x1="0" x2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="geoFill" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="triggerFill" x1="0" x2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="dirFill" x1="0" x2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="decisionFill" x1="0" x2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>
    <linearGradient id="outputFill" x1="0" x2="1">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="resultFill" x1="0" x2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fff1f2"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="url(#pageBg)"/>
  <text x="72" y="58" class="title">Hybrid+AND+TTC+RearEscape: Safety Constraint Framework</text>
  <text x="74" y="88" class="subtitle">Editable academic algorithm diagram. Colors encode module semantics consistently.</text>

  <!-- Semantic legend -->
  <rect x="1030" y="34" width="490" height="72" rx="16" ry="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.1"/>
  <text x="1052" y="60" class="small">Color semantics:</text>
  <circle cx="1058" cy="84" r="6" fill="#2563eb"/><text x="1072" y="88" class="tiny">Input</text>
  <circle cx="1130" cy="84" r="6" fill="#ea580c"/><text x="1144" y="88" class="tiny">Geometric constraint</text>
  <circle cx="1268" cy="84" r="6" fill="#7c3aed"/><text x="1282" y="88" class="tiny">Trigger</text>
  <circle cx="1335" cy="84" r="6" fill="#059669"/><text x="1349" y="88" class="tiny">Directional risk</text>
  <circle cx="1462" cy="84" r="6" fill="#b45309"/><text x="1476" y="88" class="tiny">Decision</text>

  <!-- Main canvas -->
  <rect x="70" y="125" width="1460" height="800" rx="26" ry="26" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3" filter="url(#shadow)"/>

  <!-- Stage headers -->
  <text x="120" y="165" class="stage">1. INPUT</text>
  <text x="410" y="165" class="stage">2. WAYPOINT SAFETY</text>
  <text x="770" y="165" class="stage">3. RISK REASONING</text>
  <text x="1120" y="165" class="stage">4. DECISION &amp; EXECUTION</text>

  <!-- Input -->
  <rect x="105" y="195" width="250" height="252" class="box" fill="url(#inputFill)" stroke="#2563eb" filter="url(#shadow)"/>
  <text x="132" y="230" class="label">Cooperative Perception</text>
  <text x="132" y="262" class="body">PerceptionResult</text>
  <text x="132" y="291" class="body">ego state</text>
  <text x="132" y="318" class="body">agents: pose / velocity / size</text>
  <text x="132" y="345" class="body">visibility or V2X-only flag</text>
  <line x1="132" y1="370" x2="328" y2="370" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="132" y="400" class="body">Planner waypoints</text>
  <text x="132" y="425" class="small">10 future points, 0.5s interval</text>

  <!-- Geometric branch -->
  <rect x="410" y="190" width="310" height="315" class="box" fill="url(#geoFill)" stroke="#ea580c" filter="url(#shadow)"/>
  <rect x="430" y="210" width="44" height="24" rx="12" ry="12" fill="#ea580c"/>
  <text x="442" y="227" class="badge">I-1</text>
  <text x="488" y="229" class="label">Geometric Safety Set</text>
  <text x="438" y="260" class="small">Always checks all future waypoints</text>

  <rect x="438" y="286" width="254" height="52" class="subbox" fill="#ffffff" stroke="#fed7aa"/>
  <text x="455" y="309" class="body">Visibility-aware margin</text>
  <text x="455" y="329" class="tiny">visible 2.5m, V2X-only 4.0m</text>

  <rect x="438" y="350" width="254" height="52" class="subbox" fill="#ffffff" stroke="#fed7aa"/>
  <text x="455" y="373" class="body">Approach-speed expansion</text>
  <text x="455" y="393" class="tiny">closing speed increases danger zone</text>

  <rect x="438" y="414" width="254" height="66" class="subbox" fill="#ffffff" stroke="#fed7aa"/>
  <text x="455" y="437" class="body">Multi-agent repulsive field</text>
  <text x="455" y="458" class="tiny">sum all threatening agents</text>
  <text x="455" y="476" class="tiny">avoid pushing into another object</text>

  <rect x="410" y="545" width="310" height="110" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="438" y="580" class="label">Corrected Waypoints</text>
  <text x="438" y="610" class="body">smoothed and speed-clamped trajectory</text>
  <text x="438" y="635" class="small">case WPC: 0 / 2200</text>

  <!-- Risk reasoning -->
  <rect x="770" y="190" width="300" height="185" class="box" fill="url(#triggerFill)" stroke="#7c3aed" filter="url(#shadow)"/>
  <rect x="790" y="210" width="44" height="24" rx="12" ry="12" fill="#7c3aed"/>
  <text x="802" y="227" class="badge">I-2</text>
  <text x="848" y="229" class="label">Risk Trigger</text>
  <text x="798" y="263" class="body">V1 collision probability</text>
  <text x="798" y="290" class="body">AND with geometric threats</text>
  <text x="798" y="317" class="body">TTC override for imminent risk</text>
  <rect x="798" y="337" width="244" height="25" rx="8" ry="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="812" y="354" class="mono">fire = (p&gt;.30 &amp; geom) or TTC&lt;3s</text>

  <rect x="770" y="430" width="300" height="210" class="box" fill="url(#dirFill)" stroke="#059669" filter="url(#shadow)"/>
  <rect x="790" y="450" width="44" height="24" rx="12" ry="12" fill="#059669"/>
  <text x="802" y="467" class="badge">I-3</text>
  <text x="848" y="469" class="label">Directional Risk</text>
  <text x="798" y="502" class="body">front / side TTC</text>
  <text x="798" y="531" class="body">rear TTC</text>
  <text x="798" y="560" class="body">rear gap</text>
  <line x1="798" y1="582" x2="1042" y2="582" stroke="#86efac" stroke-width="1.1"/>
  <text x="798" y="610" class="small">separates braking risk from</text>
  <text x="798" y="630" class="small">rear-end pressure</text>

  <!-- Decision -->
  <rect x="1120" y="210" width="330" height="300" class="box" fill="url(#decisionFill)" stroke="#b45309" filter="url(#shadow)"/>
  <rect x="1140" y="232" width="44" height="24" rx="12" ry="12" fill="#b45309"/>
  <text x="1152" y="249" class="badge">I-4</text>
  <text x="1198" y="250" class="label">RearEscape Decision</text>
  <text x="1148" y="284" class="body">close_rear = rear_gap &lt; 18m</text>
  <text x="1148" y="309" class="body">or rear_ttc &lt; 2.5s</text>

  <rect x="1148" y="333" width="274" height="76" class="subbox" fill="#ffffff" stroke="#fcd34d"/>
  <text x="1166" y="357" class="body">if close_rear and front_ttc ≥ 1s</text>
  <text x="1166" y="382" class="body">lane_escape = 1, factor = 1.0</text>
  <text x="1166" y="400" class="tiny">keep speed instead of hard braking</text>

  <rect x="1148" y="425" width="274" height="58" class="subbox" fill="#ffffff" stroke="#fcd34d"/>
  <text x="1166" y="449" class="body">otherwise: graded speed reduction</text>
  <text x="1166" y="472" class="tiny">front_ttc &lt; 1s uses stronger braking</text>

  <!-- Output -->
  <rect x="1120" y="555" width="330" height="140" class="box" fill="url(#outputFill)" stroke="#0d9488" filter="url(#shadow)"/>
  <text x="1148" y="590" class="label">Safe Outputs</text>
  <text x="1148" y="620" class="body">modified waypoints</text>
  <text x="1148" y="645" class="body">target_speed_factor, lane_escape</text>
  <text x="1148" y="670" class="body">interpretable risk signals</text>

  <!-- Execution and result -->
  <rect x="410" y="730" width="470" height="120" class="box" fill="#f9fafb" stroke="#9ca3af" filter="url(#shadow)"/>
  <text x="438" y="765" class="label">Closed-loop Execution</text>
  <text x="438" y="795" class="body">speed control: setSpeed(ego_speed × factor)</text>
  <text x="438" y="822" class="body">lane change if adjacent clearance &gt; 25m</text>

  <rect x="930" y="730" width="520" height="120" class="box" fill="url(#resultFill)" stroke="#ef4444" filter="url(#shadow)"/>
  <text x="958" y="765" class="label">Observed Case Result: BS3_blind_stress</text>
  <text x="958" y="795" class="body">collision = 0, overlap = 0, severity = 0</text>
  <text x="958" y="822" class="body">WPC = 0 / 2200, first_warning = 26</text>

  <!-- Arrows: clean and orthogonal -->
  <path d="M 355 320 L 395 320 L 395 347 L 410 347" class="arrowInput"/>
  <path d="M 355 320 L 745 320 L 745 282 L 770 282" class="arrowInput"/>
  <path d="M 355 320 L 745 320 L 745 535 L 770 535" class="arrowInput"/>

  <path d="M 720 600 L 745 600 L 745 355 L 770 355" class="arrowGeo"/>
  <path d="M 1070 282 L 1095 282 L 1095 360 L 1120 360" class="arrowTrigger"/>
  <path d="M 1070 535 L 1095 535 L 1095 430 L 1120 430" class="arrowDir"/>

  <path d="M 1285 510 L 1285 555" class="arrowDecision"/>
  <path d="M 1285 695 L 1285 715 L 880 715 L 880 790" class="arrowDecision"/>
  <path d="M 720 655 L 720 715 L 645 715 L 645 730" class="arrowGeo"/>
  <path d="M 880 790 L 930 790" class="arrow"/>

  <!-- Footer explanation -->
  <text x="85" y="955" class="tiny">Note: blue=input, orange=geometric safety, purple=trigger, green=directional risk, amber=decision, teal=outputs, gray=execution, red=observed result.</text>
</svg>
