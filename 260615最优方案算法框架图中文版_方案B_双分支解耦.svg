<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">

<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="55%" stop-color="#eef6ff"/>
    <stop offset="100%" stop-color="#fff7ed"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
  </filter>
  <filter id="thinShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
  </marker>
  <style>
    .small { font-family: WenQuanYi Zen Hei; font-size: 18px; fill: #475569; }
    .tiny { font-family: WenQuanYi Zen Hei; font-size: 15px; fill: #64748b; }
    .code { font-family: "JetBrains Mono", "Consolas", monospace; font-size: 17px; fill: #334155; }
    .cardTitle { font-family: WenQuanYi Zen Hei; font-size: 26px; font-weight: 800; fill: #0f172a; }
  </style>
</defs>

<rect width="1800" height="1120" fill="url(#bg)"/>
<text x="72" y="72" font-family='WenQuanYi Zen Hei' font-size="38" font-weight="800" fill="#0f172a" text-anchor="start">
<tspan x="72" dy="0">方案 B：双分支解耦框架图</tspan>
</text>
<text x="74" y="108" font-family='WenQuanYi Zen Hei' font-size="19" font-weight="500" fill="#475569" text-anchor="start">
<tspan x="74" dy="0">突出“路点修正”和“风险触发”两条分支解耦，适合说明为什么不是单一阈值策略。</tspan>
</text>
<rect x="80" y="150" width="1640" height="855" rx="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#softShadow)"/>
<rect x="130" y="230" width="300" height="575" rx="30" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.2" />

<g transform="translate(185 295) scale(1.15)" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 34 L20 18 Q23 12 31 12 L61 12 Q69 12 72 18 L80 34"/>
  <path d="M8 34 H84 V52 H8 Z" fill="#ffffff"/>
  <circle cx="25" cy="55" r="7" fill="#ffffff"/>
  <circle cx="67" cy="55" r="7" fill="#ffffff"/>
  <path d="M31 18 H61 L67 34 H25 Z"/>
</g>
<text x="170" y="455" font-family='WenQuanYi Zen Hei' font-size="28" font-weight="800" fill="#0f172a" text-anchor="start">
<tspan x="170" dy="0">统一输入</tspan>
<tspan x="170" dy="39">协同感知目标</tspan>
<tspan x="170" dy="39">上游规划路点</tspan>
</text>
<text x="170" y="585" font-family='WenQuanYi Zen Hei' font-size="20" font-weight="500" fill="#475569" text-anchor="start">
<tspan x="170" dy="0">状态 / 速度 / 尺寸</tspan>
<tspan x="170" dy="28">可见性 / V2X-only</tspan>
<tspan x="170" dy="28">未来 5s 路点序列</tspan>
</text>
<rect x="545" y="210" width="485" height="275" rx="32" fill="#fff7ed" stroke="#ea580c" stroke-width="2.4" filter="url(#thinShadow)"/>

<g transform="translate(585 250) scale(0.85)" fill="none" stroke="#ea580c" stroke-width="2.5">
  <rect x="10" y="10" width="72" height="72" rx="12" fill="#ffffff"/>
  <path d="M34 10 V82 M58 10 V82 M10 34 H82 M10 58 H82"/>
  <circle cx="58" cy="34" r="8" fill="#fed7aa"/>
</g>
<text x="690" y="260" font-family='WenQuanYi Zen Hei' font-size="30" font-weight="850" fill="#9a3412" text-anchor="start">
<tspan x="690" dy="0">几何约束分支</tspan>
</text>
<text x="690" y="310" font-family='WenQuanYi Zen Hei' font-size="21" font-weight="500" fill="#334155" text-anchor="start">
<tspan x="690" dy="0">时序安全区间：每个路点都有动态危险区</tspan>
<tspan x="690" dy="34">可见性边界 + 接近速度放大 + 多车排斥</tspan>
<tspan x="690" dy="34">输出：修正后路点，WPC 直接下降</tspan>
</text>
<rect x="545" y="555" width="485" height="275" rx="32" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.4" filter="url(#thinShadow)"/>

<g transform="translate(590 595) scale(0.82)" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round">
  <circle cx="42" cy="42" r="34" fill="#ffffff"/>
  <path d="M42 22 V43 L58 53"/>
</g>
<text x="690" y="605" font-family='WenQuanYi Zen Hei' font-size="30" font-weight="850" fill="#5b21b6" text-anchor="start">
<tspan x="690" dy="0">触发判断分支</tspan>
</text>
<text x="690" y="655" font-family='WenQuanYi Zen Hei' font-size="21" font-weight="500" fill="#334155" text-anchor="start">
<tspan x="690" dy="0">V1 碰撞概率只用于是否触发控制</tspan>
<tspan x="690" dy="34">AND 降低误报：p&gt;0.30 且 geom</tspan>
<tspan x="690" dy="34">前/侧向 TTC&lt;3s 保留紧急响应</tspan>
</text>
<rect x="1140" y="330" width="300" height="380" rx="34" fill="#ecfdf5" stroke="#059669" stroke-width="2.4" filter="url(#thinShadow)"/>

<g transform="translate(1242 370) scale(0.92)" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M18 84 C24 58 28 36 30 10"/>
  <path d="M70 84 C64 58 60 36 58 10"/>
  <path d="M44 80 V54"/>
  <path d="M44 44 V24"/>
  <path d="M32 37 L44 24 L56 37"/>
</g>
<text x="1185" y="520" font-family='WenQuanYi Zen Hei' font-size="30" font-weight="850" fill="#065f46" text-anchor="start">
<tspan x="1185" dy="0">风险方向解码</tspan>
</text>
<text x="1185" y="575" font-family='WenQuanYi Zen Hei' font-size="21" font-weight="500" fill="#334155" text-anchor="start">
<tspan x="1185" dy="0">front/side TTC</tspan>
<tspan x="1185" dy="33">rear TTC</tspan>
<tspan x="1185" dy="33">rear gap &lt; 18m</tspan>
<tspan x="1185" dy="33">rear_ttc &lt; 2.5s</tspan>
</text>
<rect x="1530" y="300" width="135" height="440" rx="34" fill="#fefce8" stroke="#ca8a04" stroke-width="2.4" filter="url(#thinShadow)"/>
<text x="1598" y="365" font-family='WenQuanYi Zen Hei' font-size="27" font-weight="900" fill="#854d0e" text-anchor="middle">
<tspan x="1598" dy="0">Rear</tspan>
<tspan x="1598" dy="34">Escape</tspan>
</text>
<text x="1598" y="465" font-family='WenQuanYi Zen Hei' font-size="25" font-weight="800" fill="#334155" text-anchor="middle">
<tspan x="1598" dy="0">保持</tspan>
<tspan x="1598" dy="40">速度</tspan>
<tspan x="1598" dy="40">+</tspan>
<tspan x="1598" dy="40">横向</tspan>
<tspan x="1598" dy="40">逃逸</tspan>
</text>
<text x="1598" y="690" font-family='WenQuanYi Zen Hei' font-size="16" font-weight="700" fill="#854d0e" text-anchor="middle">
<tspan x="1598" dy="0">lane_escape=1</tspan>
</text>
<path d="M430 520 C 487.5 470, 487.5 400, 545 350" fill="none" stroke="#0284c7" stroke-width="4" marker-end="url(#arrow)" stroke-linecap="round"/>
<path d="M430 520 C 487.5 570, 487.5 645, 545 695" fill="none" stroke="#0284c7" stroke-width="4" marker-end="url(#arrow)" stroke-linecap="round"/>
<path d="M1030 348 C 1085.0 373, 1085.0 455, 1140 480" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)" stroke-linecap="round"/>
<path d="M1030 690 C 1085.0 665, 1085.0 620, 1140 595" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)" stroke-linecap="round"/>
<path d="M1440 520 L1530 520" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow)" stroke-linecap="round"/>
<path d="M1600 740 L1600 880" fill="none" stroke="#ca8a04" stroke-width="4" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="1220" y="820" width="445" height="92" rx="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8" />
<text x="1248" y="858" font-family='WenQuanYi Zen Hei' font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">
<tspan x="1248" dy="0">闭环输出：修正路点 + target_speed_factor + lane_escape</tspan>
</text>
<text x="1248" y="888" font-family='WenQuanYi Zen Hei' font-size="18" font-weight="500" fill="#475569" text-anchor="start">
<tspan x="1248" dy="0">BS3_blind_stress：collision=0，overlap=0，WPC=0/2200</tspan>
</text>
<text x="74" y="1072" font-family='WenQuanYi Zen Hei' font-size="15" font-weight="500" fill="#64748b" text-anchor="start">
<tspan x="74" dy="0">当前综合最优主线：Hybrid+AND+TTC+RearEscape-thr0.30；图中完整三层风险接口只作为扩展能力提示，不作为最优主路径。</tspan>
</text>
</svg>
